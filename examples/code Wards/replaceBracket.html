<script>

  function replaceBrac(a){
    let result = "";
    let i = 0;
    while (i < a.length){
      let count = 1;
      while (a[i] === a[i + count]){
        count++;
      }
      if (count > 1){
        result += ')';
        i += count;
      } else {
        result += "(";
        i++;
      }
    }
    return result;
  }
   
  console.log(replaceBrac('qqq'))

</script>
